config_version = 16

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.79999998211860657
    capsule = true
    center = []
    end = [ "tray", "notifications", "network", "volume", "battery", "control-center", "session" ]
    margin_edge = 6
    margin_ends = 18
    padding = 12
    position = "bottom"
    radius = 24
    start = [ "launcher", "active_window", "workspaces", "wallpaper" ]
    thickness = 38

[battery]
warning_threshold = 20

