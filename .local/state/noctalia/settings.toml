[plugin_settings."avivbintangaringga/nix-monitor"]
generation_check_interval = 30
optimize_command = "nix store optimise -vv"
system_stats_check_interval = 30
update_check_interval = 45
update_command = "sudo nix flake update --flake /etc/nixos;sudo nixos-rebuild switch --flake /etc/nixos#nixos-btw"

[plugin_settings."noctalia/screen_recorder"]
color_range = "full"
replay_enabled = true
replay_storage = "disk"
video_codec = "hevc"
video_qp = 15

[plugins]
enabled = [ "avivbintangaringga/nix-monitor", "noctalia/screen_recorder" ]

[shell]
font_family = "JetBrainsMono Nerd Font Mono"
panel_anchor_bar = "default"
password_style = "random"
polkit_agent = true
show_close_buttons = false
telemetry_enabled = true
umbriel_audio_provider_enabled = true
umbriel_overview_type_to_launch_enabled = true

    [shell.launcher]
    default_view = "all"
    show_app_actions = true

    [shell.panel]
    launcher_placement = "attached"

[theme]
builtin = "Noctalia"
community_palette = "Oxocarbon"
mode = "dark"
shell_mode = "dark"
source = "wallpaper"
wallpaper_scheme = "vibrant"

    [theme.templates]
    builtin_ids = [ "alacritty", "gtk3", "gtk4", "qt", "umbriel" ]
    community_ids = [ "discord", "micro", "fastfetch" ]

[wallpaper]
directory = "~/Pictures/Wallpapers"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/hung/Pictures/Wallpapers/forest.png"

    [wallpaper.last]
    path = "/home/hung/Pictures/Wallpapers/forest.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/hung/Pictures/Wallpapers/forest.png"

[widget.nix-monitor]
type = "avivbintangaringga/nix-monitor:nix-monitor"

[widget.recorder]
type = "noctalia/screen_recorder:recorder"
