# ==============================================================================
# Keybinds
# Defining this table replaces the built-in bind set, so every active bind that
# should remain available is listed here.
# Syntax: https://docs.noctalia.dev/umbriel/keybinds/
# Actions: https://docs.noctalia.dev/umbriel/actions/
[keybinds]

# Applications and session
"Mod+Return" = { action = "spawn:alacritty", repeat = false }
"Mod+D" = "spawn:noctalia msg panel-toggle launcher"
"Mod+Q" = { action = "window-close", repeat = false }
"Ctrl+Alt+Delete" = "session-quit"
"Mod+Escape" = { action = "shortcuts-inhibit-toggle", allow_when_inhibited = true, repeat = false }
"Mod+I" = "spawn:noctalia msg settings-toggle"

# Focus and movement
"Alt+Tab" = "spawn:noctalia msg window-switcher hold"
"Mod+Left" = "window-focus-left"
"Mod+Right" = "window-focus-right"
"Mod+Up"   = "window-focus-previous"
"Mod+Down" = "window-focus-next"

# Vim movement keybinds
"Mod+H" = "window-focus-left"
"Mod+K"   = "window-focus-previous"
"Mod+J" = "window-focus-next"
"Mod+L" = "window-focus-right"

"Mod+Ctrl+Left" = "column-move-left"
"Mod+Ctrl+Down" = "window-move-down"
"Mod+Ctrl+Up" = "window-move-up"
"Mod+Ctrl+Right" = "column-move-right"

# Workspaces
"Mod+1" = "workspace-switch:1"
"Mod+2" = "workspace-switch:2"
"Mod+3" = "workspace-switch:3"
"Mod+4" = "workspace-switch:4"
"Mod+5" = "workspace-switch:5"
"Mod+6" = "workspace-switch:6"
"Mod+7" = "workspace-switch:7"
"Mod+8" = "workspace-switch:8"
"Mod+9" = "workspace-switch:9"
"Mod+Ctrl+1" = "window-move-to-workspace:1"
"Mod+Ctrl+2" = "window-move-to-workspace:2"
"Mod+Ctrl+3" = "window-move-to-workspace:3"
"Mod+Ctrl+4" = "window-move-to-workspace:4"
"Mod+Ctrl+5" = "window-move-to-workspace:5"
"Mod+Ctrl+6" = "window-move-to-workspace:6"
"Mod+Ctrl+7" = "window-move-to-workspace:7"
"Mod+Ctrl+8" = "window-move-to-workspace:8"
"Mod+Ctrl+9" = "window-move-to-workspace:9"

# Window state and layout
"Mod+V" = { action = "window-toggle-floating", repeat = false }
"Mod+Shift+V" = { action = "window-focus-switch-floating", repeat = false }
"Mod+P" = { action = "window-toggle-pinned", repeat = false }
"Mod+Ctrl+F" = { action = "window-toggle-maximize-to-edges", repeat = false }
"Mod+Shift+F" = { action = "window-toggle-fullscreen", repeat = false }
"Mod+F" = { action = "window-toggle-maximize", repeat = false }
"Mod+R" = "window-cycle-primary-extent"
"Mod+Shift+R" = "window-cycle-primary-extent-back"
"Mod+Comma" = "window-consume-right"
"Mod+Period" = "window-consume-or-expel-left"
"Mod+O" = { action = "overview-toggle", repeat = false }
"Mod+W" = { action = "column-toggle-tabbed", repeat = false }

# Screenshots
"Print" = "spawn:noctalia msg screenshot-region"

# Media and brightness stuff
"XF86AudioRaiseVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+"
"XF86AudioLowerVolume" = "spawn:wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-"
"XF86MonBrightnessUp" = "spawn:brightnessctl set +5%"
"XF86MonBrightnessDown" = "spawn:brightnessctl set 5%-"
"XF86AudioPlay" = "spawn:playerctl play-pause"
"XF86AudioNext" = "spawn:playerctl next"
"XF86AudioPrev" = "spawn:playerctl previous"
